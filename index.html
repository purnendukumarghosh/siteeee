<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="desktop" id="desktop">
        <!-- Icons -->
        <div class="icon" data-cmd="cat about.txt">
            <i class="fas fa-file-alt"></i>
            <span>about.txt</span>
        </div>
        <div class="icon" data-cmd="./view_projects.sh">
            <i class="fas fa-folder"></i>
            <span>projects</span>
        </div>
        <div class="icon" data-cmd="cat skills.json">
            <i class="fas fa-file-code"></i>
            <span>skills.json</span>
        </div>
        <div class="icon" data-cmd="cat contact.txt">
            <i class="fas fa-address-book"></i>
            <span>contact.txt</span>
        </div>
    </div>

    <div class="terminal-container" id="terminal-container">
        <div class="terminal-header">
            <div class="term-buttons">
                <span class="term-btn close"></span>
                <span class="term-btn minimize"></span>
                <span class="term-btn maximize"></span>
            </div>
            <div class="term-title">guest@portfolio: ~</div>
        </div>
        <div class="terminal-body" id="terminal-body">
            <div class="output" id="output">
                <div>Welcome to my portfolio OS.</div>
                <div>Type 'help' to see available commands, or click on an icon to execute it.</div>
            </div>
            <div class="input-line">
                <span class="prompt">guest@portfolio:~$</span>
                <input type="text" id="cmd-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
